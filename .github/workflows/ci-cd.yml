
name: Calculator CI-CD

on:
  push:
    branches:
      - main
      - "feature/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Build Docker Image and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build \
            -f calculator/Dockerfile \
            -t calculator-cicd:latest \
            .

      - name: Run unit tests inside Docker
        run: docker run --rm calculator-cicd:latest

  deploy:
    name: Deploy to AWS Lambda
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up AWS SAM CLI
        uses: aws-actions/setup-sam@v2

      - name: Validate SAM template
        run: sam validate --template-file calculator/template.yaml

      - name: Build Lambda package
        run: sam build --template-file calculator/template.yaml

      - name: Deploy Lambda using SAM
        run: |
          sam deploy \
            --template-file .aws-sam/build/template.yaml \
            --stack-name calculator-cicd \
            --s3-bucket aws-sam-cli-managed-default-samclisourcebucket-zpdfvgbvhodq \
            --region "$AWS_REGION" \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
